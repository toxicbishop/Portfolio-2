packages:
  - .

allowBuilds:
  "@parcel/watcher": true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - js-yaml@5.2.2

onlyBuiltDependencies:
  - "@parcel/watcher"
  - sharp
  - unrs-resolver

overrides:
  "js-yaml": ">=5.2.2"
  sharp: ">=0.35.0"
  brace-expansion: ">=5.0.8"
  "brace-expansion@<2.0.0": ">=1.1.16"

patchedDependencies:
  gray-matter@4.0.3: "patches/gray-matter@4.0.3.patch"