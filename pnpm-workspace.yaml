packages:
  - .

allowBuilds:
  "@parcel/watcher": true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - js-yaml

onlyBuiltDependencies:
  - "@parcel/watcher"
  - sharp
  - unrs-resolver

overrides:
  postcss: ">=8.5.18"
  sharp: ">=0.35.0"
  brace-expansion: ">=5.0.8"
  js-yaml: ">=5.2.2"
  "brace-expansion@<2.0.0": ">=1.1.16"
  socket.io-parser: ">=4.2.7"

patchedDependencies:
  gray-matter@4.0.3: "patches/gray-matter@4.0.3.patch"